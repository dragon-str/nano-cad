[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "nanocad"
description = "Open multiscale CAD and simulation for molecular nanotechnology"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Reda and contributors" }]
keywords = ["molecular", "nanotechnology", "cad", "simulation"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
]
dependencies = []
dynamic = ["version"]

[tool.maturin]
# The Rust bindings crate lives at the repository root, not under python/.
# This path is relative to this pyproject.toml file.
manifest-path = "../crates/python/Cargo.toml"
module-name = "nanocad._core"
python-source = "."
# The `python` feature turns on the optional pyo3 dependency in the bindings
# crate. Without it the crate stays a plain rlib, following ADR-0012.
features = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 88
target-version = ["py310"]
